
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración - La Botica</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f4f6f8;
  color:#172033;
}
.wrap{max-width:900px;margin:auto;padding:22px}
.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 22px #0001;
}
h1{margin:0 0 5px;font-size:28px}
h2{margin-top:0}
.muted{color:#667085}
input,button,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #ccd3db;
  font:inherit;
}
button{
  background:#14532d;
  color:white;
  border:0;
  font-weight:700;
  cursor:pointer;
}
button.secondary{background:#334155}
button.danger{background:#b91c1c}
button.small{width:auto;padding:9px 12px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.status{
  padding:12px;
  border-radius:10px;
  background:#eef2f6;
  margin-top:12px;
}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{
  text-align:left;
  padding:10px 5px;
  border-bottom:1px solid #e5e7eb;
}
.hidden{display:none!important}
@media(max-width:600px){
  .wrap{padding:12px}
  .card{padding:17px}
  .grid{grid-template-columns:1fr}
  table{font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="card" id="loginCard">
  <h1>Administración</h1>
  <div class="muted">La Botica Hispana · Control de Horas</div>
  <br>
  <label>PIN de administrador</label>
  <input id="adminPin" type="password"
         inputmode="numeric" placeholder="Ingresa tu PIN">
  <br><br>
  <button id="loginBtn">Entrar</button>
  <div id="loginMsg" class="status"></div>
</div>

<div id="app" class="hidden">

<div class="card">
  <h1>Panel de administrador</h1>
  <div class="muted">Gestiona los empleados de La Botica</div>
  <br>
  <div class="actions">
    <button id="refreshBtn">Actualizar empleados</button>
    <button id="logoutBtn" class="secondary">Cerrar sesión</button>
  </div>
</div>

<div class="card">
  <h2 id="formTitle">Agregar empleado</h2>

  <label>Nombre completo</label>
  <input id="name" placeholder="Nombre del empleado">

  <br><br>
  <label>PIN del empleado</label>
  <input id="pin" type="text" inputmode="numeric"
         placeholder="Ej. 1234">

  <br><br>
  <label>Pago por hora ($)</label>
  <input id="rate" type="number" min="0" step="0.01"
         placeholder="18.00">

  <br><br>
  <div class="actions">
    <button id="saveBtn">Guardar empleado</button>
    <button id="cancelBtn" class="secondary hidden">
      Cancelar edición
    </button>
  </div>
  <div id="formMsg" class="status"></div>
</div>

<div class="card">
  <h2>Empleados registrados</h2>
  <div id="loading" class="muted">Cargando...</div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>PIN</th>
          <th>Pago/h</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="employees"></tbody>
    </table>
  </div>
</div>

</div>
</div>

<script>
const SUPABASE_URL =
  "https://slqbboighwbyuxdaawyw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xgXidHkiZjr8_YFK3EMK8w_KybqBG0y";

/*
  CAMBIA ESTE PIN antes de publicar.
  Este acceso es una versión inicial.
*/
const ADMIN_PIN = "020991";

let editingId = null;
let employees = [];

function $(id){
  return document.getElementById(id);
}

function showMsg(id,text){
  $(id).textContent = text;
}

async function api(path,options={}){
  const headers = {
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    "Prefer":"return=representation",
    ...(options.headers||{})
  };

  const res = await fetch(
    SUPABASE_URL+"/rest/v1/"+path,
    {...options,headers}
  );

  const text = await res.text();

  if(!res.ok){
    throw new Error(text||res.statusText);
  }

  return text ? JSON.parse(text) : [];
}

$("loginBtn").onclick = ()=>{
  if($("adminPin").value === ADMIN_PIN){
    $("loginCard").classList.add("hidden");
    $("app").classList.remove("hidden");
    showMsg("loginMsg","");
    loadEmployees();
  }else{
    showMsg("loginMsg","PIN de administrador incorrecto.");
  }
};

$("logoutBtn").onclick = ()=>{
  $("app").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
  $("adminPin").value="";
};

async function loadEmployees(){
  $("loading").textContent="Cargando empleados...";
  try{
    employees = await api(
      "employees?select=id,name,pin,hourly_rate,active&order=id"
    );
    renderEmployees();
    $("loading").textContent="";
  }catch(e){
    $("loading").textContent="Error: "+e.message;
  }
}

function renderEmployees(){
  $("employees").innerHTML="";

  employees.forEach(emp=>{
    const tr=document.createElement("tr");

    const name=document.createElement("td");
    name.textContent=emp.name;

    const pin=document.createElement("td");
    pin.textContent=emp.pin;

    const rate=document.createElement("td");
    rate.textContent="$"+Number(emp.hourly_rate||0).toFixed(2);

    const status=document.createElement("td");
    status.textContent=emp.active ? "Activo" : "Inactivo";

    const actions=document.createElement("td");
    const wrap=document.createElement("div");
    wrap.className="actions";

    const edit=document.createElement("button");
    edit.className="small secondary";
    edit.textContent="Editar";
    edit.onclick=()=>editEmployee(emp);

    const toggle=document.createElement("button");
    toggle.className="small";
    toggle.textContent=emp.active ? "Desactivar" : "Activar";
    toggle.onclick=()=>toggleEmployee(emp);

    wrap.append(edit,toggle);
    actions.append(wrap);
    tr.append(name,pin,rate,status,actions);
    $("employees").append(tr);
  });
}

$("saveBtn").onclick=async()=>{
  const name=$("name").value.trim();
  const pin=$("pin").value.trim();
  const rate=$("rate").value.trim();

  if(!name||!pin||rate===""){
    showMsg("formMsg","Completa nombre, PIN y pago por hora.");
    return;
  }

  try{
    $("saveBtn").disabled=true;

    const body={
      name,
      pin,
      hourly_rate:Number(rate)
    };

    if(editingId===null){
      body.active=true;
      await api("employees",{
        method:"POST",
        body:JSON.stringify(body)
      });
      showMsg("formMsg","Empleado agregado correctamente.");
    }else{
      await api("employees?id=eq."+editingId,{
        method:"PATCH",
        body:JSON.stringify(body)
      });
      showMsg("formMsg","Empleado actualizado correctamente.");
    }

    clearForm();
    await loadEmployees();

  }catch(e){
    showMsg("formMsg","Error: "+e.message);
  }finally{
    $("saveBtn").disabled=false;
  }
};

function editEmployee(emp){
  editingId=emp.id;
  $("formTitle").textContent="Editar empleado";
  $("name").value=emp.name||"";
  $("pin").value=emp.pin||"";
  $("rate").value=emp.hourly_rate||0;
  $("saveBtn").textContent="Guardar cambios";
  $("cancelBtn").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function toggleEmployee(emp){
  const action=emp.active ? "desactivar" : "activar";

  if(!confirm("¿Quieres "+action+" a "+emp.name+"?")){
    return;
  }

  try{
    await api("employees?id=eq."+emp.id,{
      method:"PATCH",
      body:JSON.stringify({active:!emp.active})
    });
    await loadEmployees();
  }catch(e){
    alert("Error: "+e.message);
  }
}

function clearForm(){
  editingId=null;
  $("formTitle").textContent="Agregar empleado";
  $("name").value="";
  $("pin").value="";
  $("rate").value="";
  $("saveBtn").textContent="Guardar empleado";
  $("cancelBtn").classList.add("hidden");
}

$("cancelBtn").onclick=clearForm;
$("refreshBtn").onclick=loadEmployees;
</script>
</body>
</html>
