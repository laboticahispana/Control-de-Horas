<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Horas</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f4f6f8;
      margin: 0;
      color: #17202a;
    }

    .wrap {
      max-width: 560px;
      margin: auto;
      padding: 22px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 22px #0001;
      margin: 14px 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .muted {
      color: #667085;
    }

    input,
    button {
      font: inherit;
      border-radius: 12px;
      padding: 13px;
      border: 1px solid #ccd3db;
      width: 100%;
      box-sizing: border-box;
    }

    input {
      margin: 12px 0;
    }

    /* Teclado numérico integrado para el PIN */
    #pin {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 8px;
      cursor: default;
      background: #f8fafc;
    }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 4px 0 14px;
    }

    .pin-key {
      min-height: 58px;
      padding: 12px;
      font-size: 22px;
      border-radius: 14px;
      background: #334155;
      box-shadow: 0 2px 5px #0002;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .pin-key:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .pin-key.action {
      background: #64748b;
      font-size: 20px;
    }

    .pin-key.enter {
      background: #14532d;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: #14532d;
      color: white;
      border: 0;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #334155;
    }

    button.danger {
      background: #991b1b;
    }

    .status {
      padding: 12px;
      border-radius: 12px;
      background: #eef2ff;
      margin-top: 12px;
    }

    @media (max-width: 400px) {
      .wrap {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      .grid {
        gap: 8px;
      }

      button {
        padding: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <!-- LOGIN -->
    <div class="card">

      <h1>Control de Horas</h1>

      <div class="muted">
        La Botica • Registro de trabajadores
      </div>

      <input
        id="pin"
        type="password"
        inputmode="none"
        maxlength="8"
        placeholder="Ingresa tu PIN"
        readonly
        autocomplete="off"
        aria-label="PIN"
      >

      <div class="pin-pad" aria-label="Teclado numérico">
        <button type="button" class="pin-key" data-pin="1">1</button>
        <button type="button" class="pin-key" data-pin="2">2</button>
        <button type="button" class="pin-key" data-pin="3">3</button>
        <button type="button" class="pin-key" data-pin="4">4</button>
        <button type="button" class="pin-key" data-pin="5">5</button>
        <button type="button" class="pin-key" data-pin="6">6</button>
        <button type="button" class="pin-key" data-pin="7">7</button>
        <button type="button" class="pin-key" data-pin="8">8</button>
        <button type="button" class="pin-key" data-pin="9">9</button>
        <button type="button" class="pin-key action" id="pin-clear">C</button>
        <button type="button" class="pin-key" data-pin="0">0</button>
        <button type="button" class="pin-key action" id="pin-backspace">⌫</button>
      </div>

      <button id="login">
        Entrar
      </button>

      <div id="who" class="status" hidden></div>

    </div>


    <!-- REGISTRAR MOVIMIENTOS -->
    <div class="card" id="actions" hidden>

      <h2>Registrar movimiento</h2>

      <div class="grid">

        <button data-action="Entrada">
          Entrada
        </button>

        <button data-action="Salida" class="danger">
          Salida
        </button>

        <button id="logout" class="secondary">
          Cerrar sesión
        </button>

      </div>

      <div id="message" class="status" aria-live="polite">
        Selecciona una acción.
      </div>

    </div>


    <!-- PRUEBA DE CONEXIÓN -->
    <div class="card">

      <h2>Prueba de conexión</h2>

      <div id="connection" class="muted">
        Sin probar todavía.
      </div>

    </div>

  </div>


  <script>
    // =====================================
    // CONFIGURACIÓN SUPABASE
    // =====================================

    const SUPABASE_URL =
      "https://slqbboighwbyuxdaawyw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_xgXidHkiZjr8_YFK3EMK8w_KybqBG0y";

    let employee = null;


    // =====================================
    // FUNCIÓN API
    // =====================================

    async function api(path, options = {}) {

      const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation",
        ...(options.headers || {})
      };

      const res = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
          ...options,
          headers
        }
      );

      const text = await res.text();

      if (!res.ok) {
        throw new Error(text || res.statusText);
      }

      return text ? JSON.parse(text) : [];
    }


    // =====================================
    // PRUEBA DE CONEXIÓN
    // =====================================

    async function testConnection() {

      try {

        await api(
          "employees?select=id&limit=1"
        );

        document.getElementById(
          "connection"
        ).textContent =
          "Conexión correcta con Supabase.";

      } catch (e) {

        document.getElementById(
          "connection"
        ).textContent =
          "Error de conexión: " + e.message;

      }

    }


    // =====================================
    // TECLADO NUMÉRICO DEL PIN
    // =====================================

    const pinInput = document.getElementById("pin");

    document.querySelectorAll("[data-pin]").forEach(btn => {
      btn.onclick = () => {
        if (pinInput.value.length >= 8) return;
        pinInput.value += btn.dataset.pin;
      };
    });

    document.getElementById("pin-clear").onclick = () => {
      pinInput.value = "";
    };

    document.getElementById("pin-backspace").onclick = () => {
      pinInput.value = pinInput.value.slice(0, -1);
    };


    // =====================================
    // LOGIN
    // =====================================

    document.getElementById(
      "login"
    ).onclick = async () => {

      const pin =
        document.getElementById("pin")
          .value.trim();

      if (!pin) {

        alert("Ingresa tu PIN.");

        return;
      }

      try {

        const rows = await api(

          "employees?select=id,name" +
          "&pin=eq." +
          encodeURIComponent(pin) +
          "&active=eq.true" +
          "&limit=1"

        );

        if (!rows.length) {

          alert("PIN incorrecto.");

          return;
        }

        employee = rows[0];

        document.getElementById(
          "who"
        ).hidden = false;

        document.getElementById(
          "who"
        ).textContent =
          "Empleado: " + employee.name;

        document.getElementById(
          "actions"
        ).hidden = false;

        pinInput.value = "";

        document.getElementById(
          "message"
        ).textContent =
          "Selecciona Entrada o Salida.";

      } catch (e) {

        alert(
          "No se pudo iniciar sesión: " + e.message
        );

      }

    };


    // =====================================
    // REGISTRAR MOVIMIENTOS
    // =====================================

    document.querySelectorAll(
      "[data-action]"
    ).forEach(btn => {

      btn.onclick = async () => {

        if (!employee) {

          alert("Primero inicia sesión.");

          return;
        }

        const action =
          btn.dataset.action;

        try {

          const result = await api(
            "rpc/save_attendance_action",
            {
              method: "POST",
              body: JSON.stringify({
                p_employee_id: employee.id,
                p_action: action
              })
            }
          );

          const response = Array.isArray(result)
            ? result[0]
            : result;

          if (!response || response.allowed !== true) {
            document.getElementById("message").textContent =
              response?.message || "La acción no fue permitida.";
            return;
          }

          document.getElementById(
            "message"
          ).textContent =
            action + " registrado correctamente.";

        } catch (e) {

          document.getElementById(
            "message"
          ).textContent =
            "Error: " + e.message;

        }

      };

    });


    // =====================================
    // CERRAR SESIÓN
    // =====================================

    document.getElementById(
      "logout"
    ).onclick = () => {

      employee = null;

      document.getElementById(
        "actions"
      ).hidden = true;

      document.getElementById(
        "who"
      ).hidden = true;

      document.getElementById(
        "who"
      ).textContent = "";

      document.getElementById(
        "message"
      ).textContent =
        "Selecciona Entrada o Salida.";

      pinInput.value = "";

    };


    // =====================================
    // INICIAR PRUEBA DE CONEXIÓN
    // =====================================

    testConnection();

  </script>

</body>
</html>
