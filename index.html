
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Horas</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f4f6f8;
      margin: 0;
      color: #17202a;
    }

    .wrap {
      max-width: 560px;
      margin: auto;
      padding: 22px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 22px #0001;
      margin: 14px 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .muted {
      color: #667085;
    }

    input,
    button {
      font: inherit;
      border-radius: 12px;
      padding: 13px;
      border: 1px solid #ccd3db;
      width: 100%;
      box-sizing: border-box;
    }

    input {
      margin: 12px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: #14532d;
      color: white;
      border: 0;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #334155;
    }

    button.danger {
      background: #991b1b;
    }

    .status {
      padding: 12px;
      border-radius: 12px;
      background: #eef2ff;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    td,
    th {
      padding: 9px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .report-table {
      width: 100%;
      overflow-wrap: anywhere;
    }

    .report-table th {
      background: #f1f5f9;
    }

    #reportResults {
      overflow-x: auto;
      margin-top: 15px;
    }

    @media (max-width: 400px) {
      .wrap {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      .grid {
        gap: 8px;
      }

      button {
        padding: 11px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->
  <div class="card">

    <h1>Control de Horas</h1>

    <div class="muted">
      La Botica • Registro de trabajadores
    </div>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="Ingresa tu PIN"
    >

    <button id="login">
      Entrar
    </button>

    <div id="who" class="status" hidden></div>

  </div>


  <!-- REGISTRAR MOVIMIENTOS -->
  <div class="card" id="actions" hidden>

    <h2>Registrar movimiento</h2>

    <div class="grid">

      <button data-action="Entrada">
        Entrada
      </button>

      <button data-action="Break" class="secondary">
        Break
      </button>

      <button data-action="Lunch" class="secondary">
        Lunch
      </button>

      <button data-action="Regreso" class="secondary">
        Regreso
      </button>

      <button data-action="Salida" class="danger">
        Salida
      </button>

      <button id="logout" class="secondary">
        Cerrar sesión
      </button>

    </div>

    <div id="message" class="status" aria-live="polite">
      Selecciona una acción.
    </div>

  </div>


  <!-- REPORTES -->
  <div class="card" id="reports" hidden>

    <h2>Reporte de horas</h2>

    <div class="grid">

      <button id="dailyReport">
        📅 Reporte diario
      </button>

      <button id="weeklyReport" class="secondary">
        📊 Reporte semanal
      </button>

    </div>

    <div id="reportMessage" class="status" aria-live="polite">
      Selecciona un reporte.
    </div>

    <div id="reportResults"></div>

  </div>


  <!-- PRUEBA DE CONEXIÓN -->
  <div class="card">

    <h2>Prueba de conexión</h2>

    <div id="connection" class="muted">
      Sin probar todavía.
    </div>

  </div>

</div>


<script>

// =====================================
// CONFIGURACIÓN SUPABASE
// =====================================

const SUPABASE_URL =
  "https://slqbboighwbyuxdaawyw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xgXidHkiZjr8_YFK3EMK8w_KybqBG0y";

let employee = null;


// =====================================
// FUNCIÓN API
// =====================================

async function api(path, options = {}) {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation",
    ...(options.headers || {})
  };

  const res = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      ...options,
      headers
    }
  );

  const text = await res.text();

  if (!res.ok) {
    throw new Error(text || res.statusText);
  }

  return text ? JSON.parse(text) : [];

}


// =====================================
// FECHA LOCAL
// =====================================

function localDateString(date) {

  const year = date.getFullYear();

  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


// =====================================
// FORMATO DE HORAS
// =====================================

function formatHours(hours) {

  return Number(hours || 0).toFixed(2);

}


// =====================================
// OBTENER OFFSET LOCAL
// =====================================

function getTimezoneOffset(date) {

  const offset = -date.getTimezoneOffset();

  const sign = offset >= 0 ? "+" : "-";

  const absolute = Math.abs(offset);

  const hours = String(
    Math.floor(absolute / 60)
  ).padStart(2, "0");

  const minutes = String(
    absolute % 60
  ).padStart(2, "0");

  return `${sign}${hours}:${minutes}`;

}


// =====================================
// INICIO DEL DÍA LOCAL
// =====================================

function localStartOfDay(date) {

  return localDateString(date)
    + "T00:00:00"
    + getTimezoneOffset(date);

}


// =====================================
// FIN DEL DÍA LOCAL
// =====================================

function localEndOfDay(date) {

  return localDateString(date)
    + "T23:59:59"
    + getTimezoneOffset(date);

}


// =====================================
// TABLA DE REPORTES
// =====================================

function showReportTable(rows, title) {

  const results =
    document.getElementById("reportResults");

  if (!rows || rows.length === 0) {

    results.innerHTML =
      "<p>No hay horas registradas en este período.</p>";

    return;

  }

  let totalHours = 0;

  let html = `
    <h3>${title}</h3>

    <table class="report-table">

      <thead>
        <tr>
          <th>Empleado</th>
          <th>Fecha</th>
          <th>Horas</th>
        </tr>
      </thead>

      <tbody>
  `;

  rows.forEach(row => {

    const hours =
      Number(row.total_hours || 0);

    totalHours += hours;

    html += `
      <tr>
        <td>${row.employee_name || ""}</td>
        <td>${row.work_date || ""}</td>
        <td>${formatHours(hours)}</td>
      </tr>
    `;

  });

  html += `
      </tbody>

    </table>

    <h3>
      Total de horas: ${formatHours(totalHours)}
    </h3>
  `;

  results.innerHTML = html;

}


// =====================================
// CARGAR REPORTE
// =====================================

async function loadHoursReport(
  start,
  end,
  title
) {

  const message =
    document.getElementById("reportMessage");

  const results =
    document.getElementById("reportResults");

  message.textContent =
    "Cargando reporte...";

  results.innerHTML = "";

  try {

    const rows = await api(
      "rpc/get_hours_report",
      {
        method: "POST",

        body: JSON.stringify({

          p_start: start,

          p_end: end

        })
      }
    );

    showReportTable(rows, title);

    message.textContent =
      "Reporte cargado correctamente.";

  } catch (error) {

    console.error(
      "Error al cargar reporte:",
      error
    );

    message.textContent =
      "Error al cargar reporte: "
      + error.message;

  }

}


// =====================================
// REPORTE DIARIO
// =====================================

document.getElementById(
  "dailyReport"
).onclick = async () => {

  const today = new Date();

  const date = localDateString(today);

  await loadHoursReport(

    localStartOfDay(today),

    localEndOfDay(today),

    "Reporte diario — " + date

  );

};


// =====================================
// REPORTE SEMANAL
// =====================================

document.getElementById(
  "weeklyReport"
).onclick = async () => {

  const today = new Date();

  const day = today.getDay();

  const difference =
    day === 0 ? -6 : 1 - day;

  const monday = new Date(today);

  monday.setDate(
    today.getDate() + difference
  );

  const sunday = new Date(monday);

  sunday.setDate(
    monday.getDate() + 6
  );

  await loadHoursReport(

    localStartOfDay(monday),

    localEndOfDay(sunday),

    "Reporte semanal"

  );

};


// =====================================
// PRUEBA DE CONEXIÓN
// =====================================

async function testConnection() {

  try {

    await api(
      "employees?select=id&limit=1"
    );

    document.getElementById(
      "connection"
    ).textContent =
      "Conexión correcta con Supabase.";

  } catch (e) {

    document.getElementById(
      "connection"
    ).textContent =
      "Error de conexión: "
      + e.message;

  }

}


// =====================================
// LOGIN
// =====================================

document.getElementById(
  "login"
).onclick = async () => {

  const pin =
    document.getElementById("pin")
      .value.trim();

  if (!pin) {

    alert("Ingresa tu PIN.");

    return;

  }

  try {

    const rows = await api(

      "employees?select=id,name"
      + "&pin=eq."
      + encodeURIComponent(pin)
      + "&active=eq.true"
      + "&limit=1"

    );

    if (!rows.length) {

      alert("PIN incorrecto.");

      return;

    }

    employee = rows[0];

    document.getElementById(
      "who"
    ).hidden = false;

    document.getElementById(
      "who"
    ).textContent =
      "Empleado: " + employee.name;

    document.getElementById(
      "actions"
    ).hidden = false;

    document.getElementById(
      "reports"
    ).hidden = false;

    document.getElementById(
      "pin"
    ).value = "";

    document.getElementById(
      "message"
    ).textContent =
      "Selecciona Entrada, Break, Lunch, Regreso o Salida.";

    document.getElementById(
      "reportMessage"
    ).textContent =
      "Selecciona un reporte.";

    document.getElementById(
      "reportResults"
    ).innerHTML = "";

  } catch (e) {

    alert(
      "No se pudo iniciar sesión: "
      + e.message
    );

  }

};


// =====================================
// REGISTRAR MOVIMIENTOS
// =====================================

document.querySelectorAll(
  "[data-action]"
).forEach(btn => {

  btn.onclick = async () => {

    if (!employee) return;

    const action =
      btn.dataset.action;

    try {

      await api(

        "time_entries",

        {
          method: "POST",

          body: JSON.stringify({

            employee_id: employee.id,

            action: action

          })

        }

      );

      document.getElementById(
        "message"
      ).textContent =
        action + " registrado correctamente.";

    } catch (e) {

      document.getElementById(
        "message"
      ).textContent =
        "Error: " + e.message;

    }

  };

});


// =====================================
// CERRAR SESIÓN
// =====================================

document.getElementById(
  "logout"
).onclick = () => {

  employee = null;

  document.getElementById(
    "actions"
  ).hidden = true;

  document.getElementById(
    "reports"
  ).hidden = true;

  document.getElementById(
    "who"
  ).hidden = true;

  document.getElementById(
    "reportResults"
  ).innerHTML = "";

  document.getElementById(
    "reportMessage"
  ).textContent =
    "Selecciona un reporte.";

};


// =====================================
// INICIAR PRUEBA DE CONEXIÓN
// =====================================

testConnection();

</script>

</body>
</html>
